name: Bug report
description: Report a problem with CordKit.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small plugin or code snippet that reproduces the issue.
      render: ruby
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: cordkit
    attributes:
      label: CordKit version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: discordrb
    attributes:
      label: discordrb version
      placeholder: "3.8.0"
    validations:
      required: true

  - type: input
    id: ruby
    attributes:
      label: Ruby version
      placeholder: "3.3.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
